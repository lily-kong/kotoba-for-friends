<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kotoba for friends</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <!-- 第一次打开：输入图片密码 -->
  <form id="lock" class="hidden">
    <h1>Kotoba</h1>
    <p>Enter the password you were given.</p>
    <input id="password" type="password" autocomplete="current-password" autocapitalize="off">
    <button type="submit">Open</button>
    <div id="lockError"></div>
  </form>

  <!-- 首页：全部词汇 -->
  <div id="home" class="hidden">
    <h1>Kotoba</h1>
    <button id="guideBtn" type="button" class="small">💌 Guide &amp; letters 🌸<span id="guideNew" class="badge hidden">new</span></button>
    <div id="overall"></div>
    <div id="studyInfo"></div>
    <button id="study" type="button">Study all words</button>
    <div id="tagList"></div>
    <div id="tools">
      <button id="exportBtn" type="button" class="small">Export progress</button>
      <button id="importBtn" type="button" class="small">Import progress</button>
      <button id="reset" type="button" class="small">Reset</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" class="hidden">
  </div>

  <!-- 汉字模式（由 js/kanjimode.js 显示） -->
  <div id="kanjiPage" class="hidden">
    <h1>Kanji</h1>
    <p id="kanjiInfo"></p>
    <div id="kanjiStudyInfo"></div>
    <button id="kanjiStudy" type="button" class="hidden">Study kanji</button>
    <div id="kanjiList"></div>
  </div>

  <!-- 底部的模式切换：普通背单词 / 汉字。只在首页和汉字页显示（js/ui.js 的 show()） -->
  <nav id="modeBar" class="hidden">
    <button id="modeWords" type="button" class="mode">Words <span lang="ja">単語</span></button>
    <button id="modeKanji" type="button" class="mode">Kanji <span lang="ja">漢字</span></button>
  </nav>

  <!-- 一个分类（tag）里的单词列表 -->
  <div id="tag" class="hidden">
    <button id="back" type="button" class="small">&larr; Back</button>
    <h1 id="tagTitle"></h1>
    <div id="wordList"></div>
  </div>

  <!-- 写给朋友的指南（内容来自 FRIENDS.md，由 js/guide.js 显示） -->
  <div id="guide" class="hidden">
    <button id="guideBack" type="button" class="small">&larr; Back</button>
    <article id="guideContent"></article>
  </div>

  <!-- 答题 -->
  <div id="quiz" class="hidden">
    <div id="quizTop">
      <button id="quit" type="button" class="small" aria-label="Quit">&times;</button>
      <div id="progress"><div id="progressFill"></div></div>
    </div>
    <img id="image" alt="">
    <!-- 汉字模式的锚点读法题：这个字的小词的图片（提示，也是接下来的词的预告） -->
    <div id="previews" class="hidden"></div>
    <div id="note"></div>
    <div id="en"></div>
    <div id="display"></div>
    <div id="feedback">
      <div id="kanji"></div>
      <div id="kana"></div>
    </div>
    <!-- 屏幕键盘：按键由 js/keyboard.js 生成。#nudge 是键盘上方的一行提示（文字在 js/quiz.js 里） -->
    <div id="keyboard"><div id="nudge" class="hidden"></div></div>
  </div>

  <div id="done" class="hidden">
    <h2>Group complete!</h2>
    <button id="continue" type="button">Continue</button>
  </div>
</main>

<!-- WanaKana：把罗马字转换成假名。加载后提供全局变量 wanakana -->
<script src="https://unpkg.com/wanakana@5.3.1"></script>
<!-- marked：把 FRIENDS.md（Markdown）转成网页。加载后提供全局变量 marked -->
<script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>
<!-- 程序入口。type="module" 让 JS 文件之间可以 import，和 Python 的 import 类似 -->
<script type="module" src="js/main.js"></script>
</body>
</html>
